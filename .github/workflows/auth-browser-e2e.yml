name: Auth Browser E2E

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - '.github/workflows/auth-browser-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - '.github/workflows/auth-browser-e2e.yml'

permissions:
  contents: read

jobs:
  auth-browser-e2e:
    name: Auth Browser E2E
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/commerce
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: Run Auth browser E2E
        working-directory: apps/frontend
        run: npm run test:e2e
